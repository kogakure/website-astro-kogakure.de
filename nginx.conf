# The access log keeps no full IP address (privacy policy): IPv4 without its
# last octet, IPv6 with only its first three blocks
map $remote_addr $remote_addr_short {
	~^(?<prefix>\d+\.\d+\.\d+)\.\d+$ $prefix.0;
	~^(?<prefix>[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*): $prefix::;
	default -;
}

log_format short_ip '$remote_addr_short - [$time_local] "$request" $status $body_bytes_sent '
	'"$http_referer" "$http_user_agent"';

server {
	listen 80;
	listen [::]:80;
	server_name localhost;

	root /usr/share/nginx/html;
	index index.html;
	absolute_redirect off;

	access_log /var/log/nginx/access.log short_ip;
	# A missing file is a 404, not an error with the visitor's full IP in the error log
	log_not_found off;

	# Security headers for every response
	add_header X-Frame-Options "DENY" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

	gzip on;
	gzip_types text/css application/javascript application/json application/xml text/xml text/plain image/svg+xml application/manifest+json;
	gzip_min_length 1024;

	# The old site's URLs (SI-478), before any location is chosen.
	# scripts/check-old-urls.ts checks them against the running image.
	# The articles' URLs of the oldest site
	rewrite ^/artikel/(.*)$ /$1 permanent;
	# The recommendations are gone; the colophon names the books behind this one
	rewrite ^/empfehlungen/?$ /kolophon/ permanent;
	rewrite ^/en/recommendations/?$ /en/colophon/ permanent;
	# The book as PDF, EPUB and Kindle file is gone; the downloads page has what is left
	rewrite ^/downloads/book-kogakure\.(pdf|epub|mobi)$ /downloads/ permanent;
	# Images of the old site that other sites show
	rewrite ^/assets/images/downloads/ingo\.jpg$ /images/old/downloads/ingo-1400.webp permanent;
	rewrite ^/assets/images/downloads/ogama\.jpg$ /images/old/downloads/ogama-640.webp permanent;
	rewrite ^/assets/images/branding/og/banner-(de|en)\.png$ /images/og/prefacePage.jpg permanent;

	location / {
		try_files $uri $uri/ =404;
	}

	# Hashed build assets never change
	location /_astro/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		add_header X-Frame-Options "DENY" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		try_files $uri =404;
	}

	# Font subsets are named by their content hash (pnpm fonts)
	location ~ ^/fonts/.+\.woff2$ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		add_header X-Content-Type-Options "nosniff" always;
		try_files $uri =404;
	}

	# The service worker must always be fresh (PWA, SI-480): a deploy with a
	# new shell is a new worker, which the browser finds on the next visit
	location = /sw.js {
		add_header Cache-Control "no-cache, no-store, must-revalidate";
		add_header X-Frame-Options "DENY" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		try_files $uri =404;
	}

	# The web app manifests, one per language (src/lib/pwa/pwa.ts)
	location ~ \.webmanifest$ {
		types { }
		default_type application/manifest+json;
		add_header Cache-Control "no-cache";
		add_header X-Frame-Options "DENY" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		try_files $uri =404;
	}

	# A real 404 status, not a soft 404: German at the root
	error_page 404 /404.html;
	location = /404.html {
		internal;
	}

	# Below a language's prefix, that language's 404 page (src/i18n/languages.ts)
	location ~ ^/(?<lang>en|es|fr|pt|it|nl|ru|ja|zh|ko|he)/ {
		error_page 404 /$lang/404/index.html;
		try_files $uri $uri/ =404;
	}
}
