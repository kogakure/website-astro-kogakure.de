server {
	listen 80;
	listen [::]:80;
	server_name localhost;

	root /usr/share/nginx/html;
	index index.html;
	absolute_redirect off;

	# Security headers for every response
	add_header X-Frame-Options "DENY" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

	gzip on;
	gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
	gzip_min_length 1024;

	location / {
		try_files $uri $uri/ =404;
	}

	# Hashed build assets never change
	location /_astro/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		add_header X-Frame-Options "DENY" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		try_files $uri =404;
	}

	# Font subsets are named by their content hash (pnpm fonts)
	location ~ ^/fonts/.+\.woff2$ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		add_header X-Content-Type-Options "nosniff" always;
		try_files $uri =404;
	}

	# The service worker must always be fresh (PWA, SI-480)
	location = /sw.js {
		add_header Cache-Control "no-cache, no-store, must-revalidate";
		add_header X-Content-Type-Options "nosniff" always;
	}

	# A real 404 status, not a soft 404: German at the root
	error_page 404 /404.html;
	location = /404.html {
		internal;
	}

	# Below a language's prefix, that language's 404 page (src/i18n/languages.ts)
	location ~ ^/(?<lang>en|es|fr|pt|it|nl|ru|ja|zh|ko|he)/ {
		error_page 404 /$lang/404/index.html;
		try_files $uri $uri/ =404;
	}
}
