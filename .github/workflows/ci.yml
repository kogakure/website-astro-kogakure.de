name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Types, lint, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  e2e:
    name: E2E tests, accessibility, budgets, print
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  screenshots:
    name: Screenshot tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The browser runs in the Playwright image, as for the baselines (scripts/screenshots.ts)
      - run: pnpm test:screenshots
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshot-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t kogakure-ci .
      - name: Serve the site and wait for the healthcheck
        run: |
          docker run -d --name kogakure -p 8080:80 kogakure-ci
          for i in $(seq 1 20); do
            status=$(docker inspect --format '{{.State.Health.Status}}' kogakure)
            [ "$status" = healthy ] && break
            sleep 2
          done
          docker inspect --format '{{.State.Health.Status}}' kogakure | grep -q healthy
          curl -fsS http://localhost:8080/ | grep -q '木隠'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/gibt-es-nicht/)" = 404
      - name: Indexed on www.kogakure.de only
        run: |
          curl -fsSI http://localhost:8080/ | grep -qi '^x-robots-tag: noindex'
          headers=$(curl -fsSI -H 'Host: www.kogakure.de' http://localhost:8080/)
          if echo "$headers" | grep -qi '^x-robots-tag'; then exit 1; fi
          home=$(curl -fsS -H 'Host: www.kogakure.de' http://localhost:8080/)
          if echo "$home" | grep -q 'name="robots"'; then exit 1; fi
          curl -fsS -H 'Host: www.kogakure.de' http://localhost:8080/impressum/ | grep -q '<meta name="robots" content="noindex">'

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    # The action reads the commit list of the pull request
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
